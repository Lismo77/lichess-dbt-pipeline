
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'chess_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'chess_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Materialization by layer. Folder-level defaults; a model can override with {{ config(...) }}.
models:
  chess_dbt:
    staging:
      +materialized: view   # thin rename/cast layer — always reflects raw, costs nothing to store
    marts:
      +materialized: table  # what people query — compute once at build time, read fast

vars:
  # Games vs the Lichess AI this short are OBS/stream setup, not real games.
  # Observed setup games: 2–20 plies. Raise if setup ever runs longer; real practice
  # games vs Stockfish should comfortably exceed this.
  setup_game_max_plies: 20
