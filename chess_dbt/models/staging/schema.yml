version: 2

models:
  - name: stg_games
    description: >
      One row per Lichess game from raw.games, with JSON fields extracted and cast.
      No business logic — that lives in marts.
    columns:
      - name: game_id
        description: Lichess game id (primary key).
        data_tests:
          - unique
          - not_null
      - name: speed
        description: Lichess time-control bucket.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ultraBullet', 'bullet', 'blitz', 'rapid', 'classical', 'correspondence']
      - name: status
        description: >
          How the game ended. The allowed list is deliberately limited to statuses where
          "winner is null" really means a draw. aborted / noStart / unknownFinish are
          excluded so this test fails before they get counted as draws downstream.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mate', 'resign', 'stalemate', 'draw', 'timeout', 'outoftime', 'cheat']
      - name: winner
        description: "'white', 'black', or null for a draw."
        data_tests:
          - accepted_values:
              arguments:
                values: ['white', 'black']
      - name: created_at
        description: Game start time (converted from epoch ms).
        data_tests:
          - not_null
      - name: white_username
        description: Null when white has no account (anonymous player or Lichess AI).
      - name: black_username
        description: Null when black has no account (anonymous player or Lichess AI).
      - name: white_has_account
        description: >
          True if white is a logged-in Lichess user. False does NOT mean bot — could be
          an anonymous human; check white_ai_level.
      - name: black_has_account
        description: See white_has_account.
      - name: white_ai_level
        description: Stockfish level if white is the Lichess AI, else null.
      - name: black_ai_level
        description: Stockfish level if black is the Lichess AI, else null.
      - name: ply_count
        description: Half-moves played, from the space-separated moves string. 0 if no moves.
        data_tests:
          - not_null
      - name: opening_eco
        description: ECO code. Can be null (e.g. games started from a custom position).
      - name: opening_name
        description: "Full opening name, e.g. 'Sicilian Defense: Najdorf Variation'."
