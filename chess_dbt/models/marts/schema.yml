version: 2

models:
  - name: fct_my_games
    description: >
      One row per real game, reframed from my perspective (my color, my rating, my result).
      Excludes games with 0 plies, and stream-setup games: AI opponent and ply_count <= var setup_game_max_plies.
      Includes unrated, anonymous, and real AI games; filter with is_rated / opponent_type.
    columns:
      - name: game_id
        description: Lichess game id (primary key).
        data_tests:
          - unique
          - not_null
      - name: my_color
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['white', 'black']
      - name: my_rating
        description: My rating at game start.
        data_tests:
          - not_null
      - name: result
        description: Outcome for me. A null winner is treated as a draw — see stg_games.status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['win', 'loss', 'draw']
      - name: opponent_type
        description: >
          human = Lichess account; anonymous = no account and not AI (e.g. a
          play-with-a-friend link); ai = Lichess AI (Stockfish), see opponent_ai_level.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['human', 'anonymous', 'ai']
      - name: opponent_ai_level
        description: Stockfish level 1–8 when opponent_type = 'ai', else null.
      - name: ply_count
        description: Half-moves played (one ply = one side's move).
        data_tests:
          - not_null

  - name: dim_openings
    description: >
      Distinct openings seen in my games. Grain is (opening_eco, opening_name) — the
      same name can appear under several ECO codes, so neither column is unique alone.
    data_tests:
      - unique:
          arguments:
            column_name: "opening_eco || '|' || opening_name"
    columns:
      - name: opening_eco
        data_tests:
          - not_null
      - name: opening_family
        description: Text before the first ':' in opening_name (e.g. 'Sicilian Defense').
        data_tests:
          - not_null
      - name: opening_variation
        description: Text after the first ':', or null for a base opening.

  - name: agg_outcome_by_openings
    description: >
      Rated games vs human accounts, results by opening family. Games with no opening
      (null ECO) drop out via the inner join.
    columns:
      - name: opening_family
        data_tests:
          - unique
          - not_null

  - name: agg_outcome_summary_by_speed
    description: Rated games vs human accounts, win/loss/draw counts and percentages by speed.
    columns:
      - name: speed
        data_tests:
          - unique
          - not_null
